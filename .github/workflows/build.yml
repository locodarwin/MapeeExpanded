# Builds everything and runs the tests on every push to master. The release workflow runs it first too.
name: Build and test

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  linux:
    name: Linux (tests, Avalonia GUI, command line)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The WPF projects build here too, as they do on a Linux desktop
      - name: Build
        run: dotnet build Mapee.sln -c Release -p:EnableWindowsTargeting=true
      - name: Test
        run: dotnet test Tests/Mapee.Tests -c Release --no-build --logger "console;verbosity=normal"
      # Not in Mapee.sln; built so it keeps up with the GUI, not run yet
      - name: Build GuiProbe
        run: dotnet build Tools/GuiProbe -c Release

  windows:
    name: Windows (WPF GUI, smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Published as the release zip's Mapee.exe is, so the smoke test runs what users get
      - name: Publish
        run: dotnet publish Mapper.Gui/Mapper.Gui.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/app
      # A small made-up world (Tests/Mapee.Tests/Fixtures/SmokeWorld.cs): the sample worlds are private
      - name: Write the smoke test world
        env:
          MAPEE_SMOKE_WORLD: out/world
        run: dotnet test Tests/Mapee.Tests -c Release --filter "FullyQualifiedName~SmokeWorldTests"
      # Opens the world, presses every toolbar button and opens what each leads to (see Mapper.Gui/SmokeTest.cs);
      # the pictures and report.txt are kept as an artifact, pass or fail
      - name: Smoke test
        shell: pwsh
        timeout-minutes: 10
        run: |
          $world = (Resolve-Path out/world).Path
          $smoke = Join-Path $PWD "out/smoke"
          $run = Start-Process -FilePath out/app/Mapee.exe -ArgumentList "`"$world`"", "--smoke-test=`"$smoke`"" -Wait -PassThru
          if (Test-Path "$smoke/report.txt") { Get-Content "$smoke/report.txt" } else { Write-Output "No report was written" }
          if (Test-Path out/app/Crashes) { Get-ChildItem out/app/Crashes | ForEach-Object { Get-Content $_.FullName } }
          exit $run.ExitCode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-test
          path: |
            out/smoke
            out/app/Crashes
          if-no-files-found: ignore
